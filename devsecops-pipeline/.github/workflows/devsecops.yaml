name: DevSecOps Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  security-scans:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # 1. SAST SCAN: SONARQUBE
      # Scans the actual application code (Python, JS, Java, etc.)
      # It finds "Code Smells", bugs, and hardcoded passwords in your logic.
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # 2. IAC SCAN: CHECKOV
      # Scans our Kubernetes YAML files (Infrastructure as Code)
      # It complains if we are running as root user, missing CPU limits, etc.
      - name: Checkov K8s Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: k8s/
          framework: kubernetes
          soft_fail: false # If false, the pipeline FAILS when an issue is found!

      # 3. CONTAINER SCAN: TRIVY
      # Scans the Docker Image for vulnerable outdated packages (CVEs)
      - name: Build Docker Image
        run: docker build -t my-secure-app:${{ github.sha }} .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'my-secure-app:${{ github.sha }}'
          format: 'table'
          exit-code: '1' # Fails the pipeline if vulnerabilities are found
          severity: 'CRITICAL,HIGH' # Only block for severe issues
