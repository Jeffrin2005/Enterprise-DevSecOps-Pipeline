name: Enterprise DevSecOps Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ==========================================
  # STAGE 1: Build & Test (Functional Quality)
  # ==========================================
  build-and-test:
    name: Build and Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies & Run Tests
        run: |
          echo "Installing dependencies..."
          npm install
          echo "Running Unit Tests..."
          npm test

  # ==========================================
  # STAGE 2: Security Scans (The "Sec" part)
  # ==========================================
  security-scans:
    name: DevSecOps Security Gates
    needs: build-and-test # This ensures tests must pass BEFORE security scans run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # 1. SAST SCAN: SONARQUBE
      - name: SonarQube Code Analysis
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # 2. IAC SCAN: CHECKOV
      - name: Checkov Kubernetes Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: k8s/
          framework: kubernetes
          soft_fail: false # Blocks the build if K8s YAML is insecure

      # 3. CONTAINER SCAN: TRIVY
      - name: Build Docker Image
        run: docker build -t my-secure-app:${{ github.sha }} .

      - name: Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'my-secure-app:${{ github.sha }}'
          format: 'table'
          ignore-unfixed: true
          exit-code: '1' # Fails the build if CVEs are found
          severity: 'CRITICAL,HIGH'
